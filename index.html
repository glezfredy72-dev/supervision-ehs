<title>Supervisión EHS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de una columna, pensada para el celular: barra superior, contenido con desplazamiento y pestañas abajo.
   En computadora se centra en una columna de 560 px. Tema claro único, elegido para leerse a pleno sol en campo. */
:root{
  --paper:#EFF2F1; --surface:#FFFFFF; --sunk:#E3E8E6; --ink:#15222A; --ink-2:#4A5A61; --line:#CFD7D5;
  --accent:#0B6B53; --accent-ink:#FFFFFF; --accent-soft:#D8EEE6;
  --red:#C22A1B; --red-soft:#FBE2DE; --amber:#A86A0E; --amber-soft:#FBEBCF;
  --green:#2B7A31; --green-soft:#DFF0E0; --blue:#1D5CA3; --blue-soft:#DEE8F6; --frame:#DDE3E1;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--frame);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line),0 20px 50px -20px rgba(0,0,0,.25)}}

.appbar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:56px}
.appbar .back{border:0;background:none;width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.appbar .back:hover{background:var(--sunk)}
.appbar .t{font-weight:700;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;overflow:hidden}
.appbar .mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.appbar .co{height:30px;width:auto;flex:none;display:block}
.zone{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.net{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber);flex:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
main{padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
.tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 0 6px}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;color:var(--ink-2);font-size:11.5px;font-weight:600;position:relative;min-width:0}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] .tic{background:var(--accent-soft)}
.tic{width:54px;height:28px;border-radius:14px;display:grid;place-items:center}
.tbadge{position:absolute;top:2px;left:calc(50% + 9px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center;font-family:var(--f-mono)}

h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:.01em}
h2{font-size:19px;font-weight:700} h3{font-size:16px;font-weight:700}
.muted{color:var(--ink-2)} .small{font-size:12.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ey{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.section{display:flex;flex-direction:column;gap:10px}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;color:var(--ink);text-decoration:none;font-size:14px;min-height:42px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.blue{background:var(--blue-soft);color:var(--blue)} .pill.accent{background:var(--accent-soft);color:var(--accent)}
.code{font-family:var(--f-mono);font-weight:500;font-size:12px;padding:6px 0;width:46px;text-align:center;border-radius:6px;background:var(--accent-soft);color:var(--accent);flex:none;align-self:flex-start}
.code.c-ACC{background:var(--red-soft);color:var(--red)} .code.c-HAL{background:var(--amber-soft);color:var(--amber)}
.code.c-BPR{background:var(--green-soft);color:var(--green)} .code.c-PTR,.code.c-REC{background:var(--blue-soft);color:var(--blue)}
.ex{font-family:var(--f-mono);font-size:10px;padding:1px 5px;border:1px dashed var(--ink-2);border-radius:4px;color:var(--ink-2)}
.empty{padding:22px 14px;text-align:center;border:1.5px dashed var(--line);border-radius:10px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;align-items:center}
.notice{padding:10px 12px;border-radius:8px;font-size:13.5px;background:var(--blue-soft)}
.notice.warn{background:var(--amber-soft)} .notice.bad{background:var(--red-soft)} .notice.ok{background:var(--green-soft)}
.proj{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.sos{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:10px;background:var(--red);color:#fff;padding:15px 16px;cursor:pointer;text-align:left}
.sos .k{font-size:21px;font-weight:800;line-height:1.1}
.sos .d{font-size:13px;opacity:.92}
.sos .i{width:44px;height:44px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:900;font-size:22px;flex:none}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.step.done .dot{background:var(--green);border-color:var(--green)}
.step .lbl{font-size:13px;font-weight:600;line-height:1.2}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{display:flex;gap:12px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.mod:hover,.item:hover{border-color:var(--accent)}
.mod-t{font-weight:700;line-height:1.2;display:block}
.mod-d{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:block}
.mod-ec{font-family:var(--f-mono);font-size:10px;color:var(--ink-2);margin-top:5px;display:block;letter-spacing:.03em}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.item-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.item-t{font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item-m{font-size:12px;color:var(--ink-2)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.sync{background:var(--amber-soft);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;border:0;text-align:left;width:100%}

.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.flabel,.field>label{font-weight:700;font-size:14px}
.req{color:var(--red)}
.help{font-size:12.5px;color:var(--ink-2)}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;min-height:44px;font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field.err .inp,.field.err .box{border-color:var(--red)}
.err-msg{font-size:12.5px;color:var(--red)}
.box{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chk-row{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.chk-row:first-child{border-top:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);padding:8px;border-radius:7px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"].v-si{background:var(--green);border-color:var(--green);color:#fff}
.seg button[aria-pressed="true"].v-no{background:var(--red);border-color:var(--red);color:#fff}
.seg button[aria-pressed="true"].v-na{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.rowcard{border-radius:8px;padding:10px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.rowcard label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:92px;height:92px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.sigbox{background:#fff;border:1px solid var(--line);border-radius:8px;height:100px;display:grid;place-items:center;cursor:pointer;color:#5b6a70;font-size:13.5px;overflow:hidden}
.sigbox img{max-height:100%;max-width:100%}
.att{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.att .sg{width:100px;height:40px;background:#fff;border-radius:4px;display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--line)}
.att .sg img{max-height:100%}
.auto{background:var(--sunk);border-radius:8px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.actions{position:sticky;bottom:0;background:var(--surface);padding:10px 16px;display:flex;gap:8px;border-top:1px solid var(--line);margin:0 -16px -32px;z-index:2}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .s{font-size:11px;color:var(--ink-2)}
.kpi.st-red{border-color:var(--red);box-shadow:inset 5px 0 0 var(--red)} .kpi.st-amber{box-shadow:inset 5px 0 0 var(--amber)} .kpi.st-green{box-shadow:inset 5px 0 0 var(--green)}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rate{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rate .l{font-weight:700;font-size:13px} .rate .v{font-family:var(--f-mono);font-size:21px;font-weight:500} .rate .f{font-size:10.5px;color:var(--ink-2);font-family:var(--f-mono)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.swc{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:700;font-size:11.5px;color:var(--ink-2);background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
tr:last-child td{border-bottom:0}

.modal{position:absolute;inset:0;z-index:40;background:rgba(10,18,22,.55);display:flex;align-items:flex-end}
.modal[hidden]{display:none}
.sheet{background:var(--paper);width:100%;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px 22px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.kv{display:flex;flex-direction:column;gap:2px;margin:0}
.kv dt{color:var(--ink-2);font-size:12px;margin-top:8px}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px}
canvas.pad{width:100%;aspect-ratio:400/150;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:#fff;padding:11px 14px;border-radius:8px;z-index:60;font-size:14px;text-align:center}
.push{position:absolute;left:10px;right:10px;top:10px;z-index:70;background:var(--surface);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px;display:flex;gap:10px;cursor:pointer;animation:drop .35s ease-out;border:1px solid var(--line);text-align:left}
.push .pi{width:30px;height:30px;border-radius:8px;background:var(--red);flex:none;display:grid;place-items:center}
.push b{font-size:13.5px} .push .pt{font-size:12.5px;color:var(--ink-2)}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
.pdf{background:#fff;color:#15222a;border-radius:6px;padding:16px;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;border:1px solid var(--line)}
.pdf .hd{display:flex;gap:10px;align-items:center;border-bottom:3px solid #15222a;padding-bottom:8px;margin-bottom:10px}
.pdf h4{margin:0;font-size:15px} .pdf table{font-size:11px} .pdf th,.pdf td{border:1px solid #c8d0ce;white-space:normal;vertical-align:top;color:#15222a}
.pdf th{background:#eef2f1;width:34%}
.center{display:flex;flex-direction:column;gap:14px;padding-top:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* =====================================================================
   CONFIGURACIÓN DE FIREBASE
   Pega aquí los datos de tu proyecto (Consola de Firebase → Configuración
   del proyecto → Tus apps → App web → Configuración). Paso 3 de la guía.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBblnmpxwAlfvDMVPHJTweQHLejpgeMktg",
  authDomain: "supervision-ehs.firebaseapp.com",
  projectId: "supervision-ehs",
  storageBucket: "supervision-ehs.firebasestorage.app",
  messagingSenderId: "690630883568",
  appId: "1:690630883568:web:5839f466b6171f619c2a35"
};

/* ===================== Nube: sesión y base de datos ===================== */
(function(){
  const CONFIGURED = !String(FIREBASE_CONFIG.apiKey).includes("PEGA_AQUI");
  let fbApp = null, auth = null, fs = null, isAdminFlag = false, registering = false, started = false, mode = "login";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toastMsg = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastMsg.t); toastMsg.t = setTimeout(() => t.hidden = true, 3600); };

  function authError(e){
    const c = e && e.code || "";
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "Correo o contraseña incorrectos.";
    if (/email-already-in-use/.test(c)) return "Ese correo ya tiene cuenta. Usa Iniciar sesión.";
    if (/weak-password/.test(c)) return "La contraseña debe tener al menos 6 caracteres.";
    if (/invalid-email/.test(c)) return "El correo no es válido.";
    if (/network-request-failed/.test(c)) return "Sin conexión. Revisa tu internet e intenta de nuevo.";
    if (/too-many-requests/.test(c)) return "Demasiados intentos. Espera unos minutos.";
    if (/operation-not-allowed/.test(c)) return "Activa el acceso con correo y contraseña en Firebase (paso 2 de la guía).";
    if (/unauthorized-domain|requests-from-referer/.test(c)) return "Este dominio no está autorizado en Firebase (paso 6 de la guía).";
    if (/permission-denied/.test(c)) return "Firebase rechazó la operación. Revisa que publicaste las reglas de seguridad (paso 4).";
    return "No se pudo completar. Intenta de nuevo.";
  }

  /* ---------- Pantallas de inicio de sesión y registro ---------- */
  const brand = `<div style="text-align:center"><img src="${window.COMPANY_LOGO}" alt="OCA Global" style="height:84px;width:auto;margin:6px auto 10px;display:block"><h1 style="margin:0">Supervisión EHS</h1><div class="muted">Seguridad e higiene en campo</div></div>`;
  function shell(){
    $("#appbar").innerHTML = `<img class="co" src="${window.COMPANY_LOGO}" alt="OCA Global"><span class="t">Supervisión EHS</span>`;
    $("#tabbar").hidden = true;
  }
  function viewLogin(){
    return `<div class="center">${brand}
    <div class="chips"><button class="chip" data-auth="login" aria-pressed="${mode === "login"}">Iniciar sesión</button><button class="chip" data-auth="registro" aria-pressed="${mode === "registro"}">Registrarme</button></div>
    ${mode === "login" ? `<form class="card form" id="cl-login" novalidate>
      <div class="field"><label for="cl-e">Correo</label><input class="inp" id="cl-e" type="email" autocomplete="email" placeholder="tu@empresa.com"></div>
      <div class="field"><label for="cl-p">Contraseña</label><input class="inp" id="cl-p" type="password" autocomplete="current-password"></div>
      <button class="btn primary" type="submit" id="cl-btn">Iniciar sesión</button>
      <button class="btn ghost" type="button" data-auth="reset">Olvidé mi contraseña</button></form>`
    : mode === "reset" ? `<form class="card form" id="cl-reset" novalidate>
      <div class="muted small">Te enviamos un correo para crear una contraseña nueva.</div>
      <div class="field"><label for="cl-re">Correo</label><input class="inp" id="cl-re" type="email" autocomplete="email"></div>
      <button class="btn primary" type="submit">Enviar correo</button>
      <button class="btn ghost" type="button" data-auth="login">Regresar</button></form>`
    : `<form class="card form" id="cl-reg" novalidate>
      <div class="notice">Crea tu cuenta. El administrador revisa tu solicitud y te asigna tus proyectos.</div>
      <div class="field"><label for="cr-n">Nombre completo <span class="req">*</span></label><input class="inp" id="cr-n" autocomplete="name"></div>
      <div class="field"><label for="cr-e">Correo <span class="req">*</span></label><input class="inp" id="cr-e" type="email" autocomplete="email"></div>
      <div class="field"><label for="cr-p">Contraseña <span class="req">*</span></label><input class="inp" id="cr-p" type="password" autocomplete="new-password"><div class="help">Mínimo 6 caracteres.</div></div>
      <div class="field"><label for="cr-t">Celular (WhatsApp)</label><input class="inp" id="cr-t" inputmode="tel"></div>
      <div class="field"><label for="cr-em">Empresa <span class="req">*</span></label><input class="inp" id="cr-em"></div>
      <div class="field"><label for="cr-pu">Puesto</label><input class="inp" id="cr-pu" placeholder="Ej. Supervisor de seguridad"></div>
      <div class="field"><label for="cr-r">Rol solicitado</label><select class="inp" id="cr-r"><option value="supervisor">Supervisor de campo (registra)</option><option value="visor">Visor (consulta tablero y reportes)</option></select></div>
      <button class="btn primary" type="submit" id="cr-btn">Crear mi cuenta</button></form>`}
    <div class="card"><h3>Úsala como app en tu celular</h3><div class="small muted">Abre este enlace en Chrome, toca el menú ⋮ y elige <b>Agregar a pantalla principal</b>.</div></div></div>`;
  }
  function showAuth(){ shell(); $("#app").innerHTML = viewLogin(); }
  function showMsg(title, text){ shell(); $("#app").innerHTML = `<div class="center">${brand}<div class="card"><h2>${esc(title)}</h2><div class="muted">${text}</div></div></div>`; }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-auth]"); if (!b) return;
    mode = b.dataset.auth; showAuth();
  });
  document.addEventListener("submit", async e => {
    const id = e.target.id; if (!/^cl-|^cr-/.test(id) && id !== "cl-reg") return;
    e.preventDefault(); e.stopImmediatePropagation();
    try {
      if (id === "cl-login") {
        const em = $("#cl-e").value.trim(), pw = $("#cl-p").value;
        if (!em || !pw) { toastMsg("Escribe tu correo y contraseña."); return; }
        $("#cl-btn").disabled = true;
        await FB.signInWithEmailAndPassword(auth, em, pw);
      } else if (id === "cl-reset") {
        const em = $("#cl-re").value.trim(); if (!em) { toastMsg("Escribe tu correo."); return; }
        await FB.sendPasswordResetEmail(auth, em); toastMsg("Listo. Revisa tu correo."); mode = "login"; showAuth();
      } else if (id === "cl-reg") {
        const d = { nombre: $("#cr-n").value.trim(), email: $("#cr-e").value.trim(), telefono: $("#cr-t").value.trim(), empresa: $("#cr-em").value.trim(), puesto: $("#cr-pu").value.trim(), rol: $("#cr-r").value };
        const pw = $("#cr-p").value;
        if (!d.nombre || !d.email || !d.empresa) { toastMsg("Completa nombre, correo y empresa."); return; }
        if (pw.length < 6) { toastMsg("La contraseña debe tener al menos 6 caracteres."); return; }
        $("#cr-btn").disabled = true; registering = true;
        const cred = await FB.createUserWithEmailAndPassword(auth, d.email, pw);
        await FB.updateProfile(cred.user, { displayName: d.nombre });
        const uid = cred.user.uid, now = new Date().toISOString();
        const setup = await FB.getDoc(FB.doc(fs, "config", "setup"));
        if (!setup.exists()) {
          // La primera persona que se registra queda como administrador.
          await FB.setDoc(FB.doc(fs, "config", "setup"), { adminUid: uid, createdAt: now });
          await FB.setDoc(FB.doc(fs, "members", uid), { nombre: d.nombre, email: d.email, telefono: d.telefono, empresa: d.empresa, puesto: d.puesto, role: "admin", projects: [], active: true, rejected: false, createdAt: now });
          toastMsg("Cuenta de administrador creada.");
        } else {
          await FB.setDoc(FB.doc(fs, "requests", uid), { ...d, projectId: "", createdAt: now });
          toastMsg("Cuenta creada. Espera la aprobación del administrador.");
        }
        registering = false; startFor(cred.user);
      }
    } catch (err) {
      registering = false;
      toastMsg(authError(err));
      const b = $("#cl-btn") || $("#cr-btn"); if (b) b.disabled = false;
    }
  }, true);

  /* ---------- Adaptador: la app usa esta interfaz para leer y guardar ---------- */
  const mapErr = e => ({ code: /permission-denied/.test(e && e.code) ? "invalid_argument" : /resource-exhausted/.test(e && e.code) ? "quota_exceeded" : "unavailable", message: e && e.message });
  const wrapDoc = d => ({ id: d.id, exists: d.exists(), data: () => d.data(), metadata: d.metadata });
  function q(path, cons){
    return {
      where: (f, op, v) => q(path, cons.concat(FB.where(f, op, v))),
      orderBy: (f, dir) => q(path, cons.concat(FB.orderBy(f, dir || "asc"))),
      limit: n => q(path, cons.concat(FB.limit(n))),
      onSnapshot(next, err){
        return FB.onSnapshot(FB.query(FB.collection(fs, path), ...cons), s => next({
          docs: s.docs.map(wrapDoc), size: s.size, empty: s.empty, metadata: s.metadata,
          docChanges: () => s.docChanges().map(c => ({ type: c.type, doc: wrapDoc(c.doc) }))
        }), e => err && err(mapErr(e)));
      },
      doc: id => docRef(path + "/" + id)
    };
  }
  function docRef(path){
    const r = () => FB.doc(fs, path);
    const run = p => p.catch(e => { throw mapErr(e); });
    return {
      id: path.split("/").pop(), path,
      set: d => run(FB.setDoc(r(), d)),
      update: d => run(FB.updateDoc(r(), d)),
      delete: () => run(FB.deleteDoc(r())),
      get: () => FB.getDoc(r()).then(wrapDoc),
      onSnapshot: (next, err) => FB.onSnapshot(r(), d => next(wrapDoc(d)), e => err && err(mapErr(e)))
    };
  }
  const db = { collection: p => q(p, []), doc: docRef };

  // Descargas de reportes y CSV.
  const downloads = { async save({ filename, data }){
    const type = /\.csv$/i.test(filename) ? "text/csv;charset=utf-8" : "text/html;charset=utf-8";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return { status: "saved" };
  } };

  // Crear usuarios desde el administrador sin cerrar su sesión (se usa una segunda conexión temporal).
  async function createUser(d){
    const sec = FB.initializeApp(FIREBASE_CONFIG, "alta-" + Date.now());
    let uid;
    try {
      const sa = FB.initializeAuth(sec, { persistence: FB.inMemoryPersistence });
      const c = await FB.createUserWithEmailAndPassword(sa, d.email, d.password);
      await FB.updateProfile(c.user, { displayName: d.nombre });
      uid = c.user.uid;
      await FB.signOut(sa);
    } catch (e) { throw { code: e.code, message: authError(e) }; }
    finally { FB.deleteApp(sec).catch(() => {}); }
    await FB.setDoc(FB.doc(fs, "members", uid), { nombre: d.nombre, email: d.email, telefono: d.telefono || "", empresa: d.empresa || "", puesto: d.puesto || "", role: d.role, projects: d.projects, active: true, rejected: false, createdBy: auth.currentUser.uid, createdAt: new Date().toISOString() });
    return uid;
  }

  async function startFor(user){
    if (started) return; started = true;
    let setup = null;
    try { setup = await FB.getDoc(FB.doc(fs, "config", "setup")); }
    catch (e) { started = false; showMsg("No se pudo conectar", "Firebase rechazó la conexión. Revisa que publicaste las reglas de seguridad (paso 4 de la guía) y tu internet."); return; }
    isAdminFlag = !!(setup.exists() && setup.data().adminUid === user.uid);
    const userCap = {
      id: async () => user.uid,
      me: async () => ({ id: user.uid, name: user.displayName || "", email: user.email, isOwner: isAdminFlag, canEdit: isAdminFlag }),
      isOwner: async () => isAdminFlag, canEdit: async () => isAdminFlag, can: async () => true
    };
    const caps = { db, user: userCap, downloads };
    window.claude = { use: async n => caps[n] || null };
    window.startApp();
  }

  window.cloud = {
    createUser,
    email: () => auth && auth.currentUser && auth.currentUser.email,
    async logout(){ try { await FB.signOut(auth); } catch (e) {} location.reload(); },
    authError
  };

  window.addEventListener("DOMContentLoaded", () => {
    if (!CONFIGURED) { showMsg("Conecta tu proyecto de Firebase", "Abre este archivo con un editor de texto, busca <b>FIREBASE_CONFIG</b> y pega los datos de tu proyecto (paso 3 de la guía)."); return; }
    fbApp = FB.initializeApp(FIREBASE_CONFIG);
    auth = FB.getAuth(fbApp);
    try { fs = FB.initializeFirestore(fbApp, { localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() }) }); }
    catch (e) { fs = FB.initializeFirestore(fbApp, { localCache: FB.memoryLocalCache() }); }
    FB.setPersistence(auth, FB.browserLocalPersistence).catch(() => {});
    shell(); $("#app").innerHTML = `<div class="empty">Conectando…</div>`;
    FB.onAuthStateChanged(auth, u => {
      if (registering) return;
      if (u) startFor(u); else if (!started) showAuth(); else location.reload();
    });
  });
})();

  db.doc("members/"+S.uid).onSnapshot(d=>{S.members=d.exists?{[S.uid]:{id:S.uid,...d.data()}}:{};S.loaded.m=1;subRecords();schedule()},()=>{S.members={};S.loaded.m=1;subRecords();schedule()});

 }

function dash(){
 const f=S.f,ps=f.proj==="all"?myProjects():myProjects().filter(p=>p.id===f.proj),ids=ps.map(p=>p.id);
 const all=visible().filter(r=>ids.includes(r.projectId)&&!r.pending),lim=f.period==="all"?0:Date.now()-Number(f.period)*864e5;
 const rs=all.filter(r=>new Date(r.createdAt)>=lim),by=t=>rs.filter(r=>r.type===t);
 const hal=by("hallazgo"),acc=by("accidente"),openAll=all.filter(isOpen),alto=openAll.filter(r=>r.values.riesgo==="Alto");
 const closed=hal.filter(r=>r.status==="cerrado").length,lesion=acc.filter(r=>/^Lesión/.test(r.values.tipo||"")),lti=acc.filter(r=>r.values.tipo==="Lesión con tiempo perdido");
 const dart=acc.filter(r=>r.values.tipo==="Lesión con tiempo perdido"||Number(r.values.dias)>0),casi=acc.filter(r=>r.values.tipo==="Casi accidente");
 const hh=ps.reduce((s,p)=>s+(Number(p.hh)||0),0);
 const thrAlto=ps.length?Math.min(...ps.map(p=>Number(p.thr&&p.thr.alto)||3)):3,thrTrir=ps.length?Math.min(...ps.map(p=>Number(p.thr&&p.thr.trir)||2)):2;
 return{ps,all,rs,by,hal,acc,openAll,alto,closed,lesion,lti,dart,casi,hh,thrAlto,thrTrir};
}

function drawCharts(){
 const D=dash(),cw=$("#chWeek"),ca=$("#chArea");if(!cw||!ca)return;
 const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
 const W=[];for(let i=7;i>=0;i--){const s=new Date(mon);s.setDate(s.getDate()-7*i);W.push({s,a:0,c:0})}
 D.all.filter(r=>r.type==="hallazgo").forEach(r=>{const d=new Date(r.createdAt);for(let i=W.length-1;i>=0;i--)if(d>=W[i].s){r.values.tipo==="Acto inseguro"?W[i].a++:W[i].c++;break}});
 const w=340,h=170,L=26,T=8,B=24,max=Math.max(4,...W.map(x=>x.a+x.c)),nice=Math.ceil(max/4)*4,y=v=>T+(h-T-B)*(1-v/nice),bw=(w-L-4)/W.length;
 let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Hallazgos por semana">`;
 for(let i=0;i<=4;i++){const v=nice*i/4;s+=`<line x1="${L}" x2="${w-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">${v}</text>`}
 W.forEach((x,i)=>{const X=L+i*bw+bw*.2,ww=bw*.6;if(x.a)s+=`<rect x="${X}" y="${y(x.a)}" width="${ww}" height="${y(0)-y(x.a)}" fill="var(--blue)" rx="2"><title>${x.a} actos</title></rect>`;if(x.c)s+=`<rect x="${X}" y="${y(x.a+x.c)}" width="${ww}" height="${y(x.a)-y(x.a+x.c)}" fill="var(--amber)" rx="2"><title>${x.c} condiciones</title></rect>`;if(i%2||i===W.length-1)s+=`<text x="${X+ww/2}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--ink-2)">${pad(x.s.getDate())}/${pad(x.s.getMonth()+1)}</text>`});
 cw.innerHTML=s+"</svg>";
 const ar={};D.hal.forEach(r=>{const a=r.values.area||"Sin área";ar[a]=ar[a]||{t:0,o:0};ar[a].t++;if(isOpen(r))ar[a].o++});
 const top=Object.entries(ar).sort((a,b)=>b[1].t-a[1].t).slice(0,5);
 if(!top.length){ca.innerHTML=`<div class="muted small">Sin hallazgos en el periodo.</div>`;return}
 const mx=top[0][1].t,LW=130,span=w-LW-34,H2=top.length*28+4;let t=`<svg viewBox="0 0 ${w} ${H2}" role="img" aria-label="Hallazgos por área">`;
 top.forEach(([a,v],i)=>{const yy=2+i*28,fl=span*v.t/mx,op=span*v.o/mx,lb=a.length>19?a.slice(0,18)+"…":a;t+=`<text x="${LW-6}" y="${yy+17}" text-anchor="end" font-size="11" fill="var(--ink)">${esc(lb)}</text><rect x="${LW}" y="${yy+5}" width="${Math.max(2,fl)}" height="16" fill="var(--accent-soft)" rx="2"/>${v.o?`<rect x="${LW}" y="${yy+5}" width="${op}" height="16" fill="var(--accent)" rx="2"/>`:""}<text x="${LW+fl+5}" y="${yy+17}" font-size="11" fill="var(--ink-2)">${v.t}${v.o?` (${v.o})`:""}</text>`});
 ca.innerHTML=t+"</svg>";
}

function syncProject(){
 const p=S.editProject;if(!p)return;
 document.querySelectorAll("[data-pf]").forEach(el=>{const k=el.dataset.pf;p[k]=el.dataset.split?el.value.split("\n").map(s=>s.trim()).filter(Boolean):k==="hh"?Number(el.value)||0:el.value.trim()});
 document.querySelectorAll("[data-thr]").forEach(el=>p.thr[el.dataset.thr]=Number(el.value)||0);
 document.querySelectorAll("[data-mod]").forEach(el=>p.modules[el.dataset.mod]=el.checked);
 const em=$("#pj-e");if(em)p.notify.emails=em.value.split(/[\n,;]/).map(s=>s.trim()).filter(Boolean);
 const ph=$("#pj-w");if(ph)p.notify.phones=ph.value.split("\n").map(s=>s.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)[,\s]+([+\d][\d\s-]{7,})$/);return m?{name:m[1].trim(),num:m[2].replace(/[\s-]/g,"")}:{name:"",num:l.replace(/[\s-]/g,"")}});
 const evs=[...document.querySelectorAll("[data-ev]")];if(evs.length)p.notify.events=evs.filter(e=>e.checked).map(e=>e.dataset.ev);
 const act=$("#pj-act");if(act)p.active=act.checked;
}
async function saveProject(e){
 e.preventDefault();syncProject();const p=S.editProject;
 if(!p.nombre){toast("Escribe el nombre del proyecto.");$("#pj-n").focus();return}
 const d={...p};delete d._new;delete d.id;d.updatedAt=new Date().toISOString();
 try{await S.db.doc("projects/"+p.id).set(d);toast("Proyecto guardado");back()}catch(err){toast(err&&err.code==="invalid_argument"?"Solo el administrador puede guardar proyectos, o el logo es demasiado grande.":"No se pudo guardar el proyecto.")}
}

/* ===================== Eventos ===================== */
document.addEventListener("click",async e=>{
 if(e.target.id==="modal"){closeModal();return}
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,v=b.dataset.v,F=S.form;
 switch(a){
  case"tab":go(v);break;
  case"logout":if(window.cloud)cloud.logout();break;
  case"user-new":openNewUser();break;
  case"nu-proj":b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");break;
  case"nu-share":{const t=$("#nu-txt");try{await navigator.clipboard.writeText(t.value);toast("Datos copiados")}catch(err){t.focus();t.select();toast("Selecciona y copia el texto")}break}
  case"back":S.ap=null;back();break;
  case"reg-open":S.tab="registro";S.stack=[];render(true);break;
  case"new":newForm(v);break;
  case"sync":if(S.online)flush();break;
  case"go-open":S.f={...S.f,type:"hallazgo",status:"abierto",period:"all",proj:S.projectId||"all"};go("registros");break;
  case"chip":{const arr=F.values[b.dataset.k]=F.values[b.dataset.k]||[];const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);render();break}
  case"seg":{const o=F.values[b.dataset.k]=F.values[b.dataset.k]||{};o[b.dataset.i]=v;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));const fe=b.closest(".field.err");if(fe){fe.classList.remove("err");fe.querySelector(".err-msg")?.remove()}break}
  case"row-add":(F.values[b.dataset.k]=F.values[b.dataset.k]||[]).push({});render();break;
  case"row-del":case"ph-del":case"att-del":F.values[b.dataset.k].splice(+b.dataset.i,1);render();break;
  case"sign":{const k=b.dataset.k;openSign("Firma",d=>{F.values[k]=d;closeModal();render()});break}
  case"att-add":{const k=b.dataset.k;openSign("Agregar persona",(d,n,em)=>{(F.values[k]=F.values[k]||[]).push({nombre:n,empresa:em,firma:d});closeModal();render()},true);break}
  case"pad-clear":{const c=$("#pad");c.getContext("2d").clearRect(0,0,c.width,c.height);c._ink=false;break}
  case"pad-ok":{const c=$("#pad"),n=$("#at-n");if(n&&!n.value.trim()){toast("Escribe el nombre.");n.focus();return}if(!c._ink){toast("Firma en el recuadro.");return}const o=document.createElement("canvas");o.width=480;o.height=180;const x=o.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,480,180);x.drawImage(c,0,0,480,180);padCb(o.toDataURL("image/jpeg",.7),n?n.value.trim():"",$("#at-e")?$("#at-e").value.trim():"");break}
  case"close":closeModal();break;
  case"open":openRecord(v);break;
  case"pdf":openPdf(v);break;
  case"dl-rec":{const r=allRecords().find(x=>x.id===v);save(`${r.folio}.html`,docShell(MOD[r.type].name,`${projName(r.projectId)} · ${MOD[r.type].ec}`,S.projects[r.projectId],recBlock(r)));break}
  case"notify":openNotify(allRecords().find(r=>r.id===v));break;
  case"copy":{const t=$("#nt-txt");try{await navigator.clipboard.writeText(t.value);toast("Mensaje copiado")}catch(err){t.focus();t.select();toast("Selecciona y copia el texto")}break}
  case"close-h":{const note=$("#cl-note").value.trim();if(!note){toast("Describe la acción implementada.");return}try{await S.db.doc("records/"+v).update({status:"cerrado",closedAt:new Date().toISOString(),closedBy:authorName(),closeNote:note});closeModal();toast("Hallazgo cerrado")}catch(err){toast("No se pudo cerrar. Revisa tu conexión.")}break}
  case"ack":try{await S.db.doc("records/"+v).update({ack:{by:authorName(),at:new Date().toISOString()}});closeModal();toast("Marcado como enterado")}catch(err){toast("No se pudo actualizar.")}break;
  case"del-rec":$("#delConfirm").hidden=false;break;
  case"del-no":$("#delConfirm").hidden=true;break;
  case"del-yes":try{await S.db.doc("records/"+v).delete();closeModal();toast("Registro eliminado")}catch(err){toast("No se pudo eliminar.")}break;
  case"csv":csvExport();break;
  case"drill":{const[t,x]=v.split(":");S.f={...S.f,type:t==="t"?x:["abierto","alto"].includes(x)?"hallazgo":"accidente",status:t==="s"?x:"all"};if(["abierto","alto"].includes(x))S.f.period="all";go("registros");break}
  case"clearf":S.f={...S.f,type:"all",status:"all"};render();break;
  case"aseg":S.adminSeg=v;render();break;
  case"req":S.reqId=v;S.ap=null;push("usuario");break;
  case"aprole":S.ap.role=v;render();break;
  case"approj":{const i=S.ap.projects.indexOf(v);i<0?S.ap.projects.push(v):S.ap.projects.splice(i,1);render();break}
  case"approve":{if(!S.ap.projects.length){toast("Asigna al menos un proyecto.");return}const wasMember=!!S.members[S.reqId]&&!S.members[S.reqId].rejected;if(await writeMember(S.reqId,{role:S.ap.role,projects:[...S.ap.projects],active:true,approvedAt:new Date().toISOString()})){S.ap=null;back();toast(wasMember?"Cambios guardados":"Acceso aprobado")}break}
  case"reject":if(await writeMember(S.reqId,{active:false,rejected:true})){S.ap=null;back();toast("Solicitud rechazada")}break;
  case"ap-toggle":{const m=S.members[S.reqId];if(await writeMember(S.reqId,{active:!m.active})){S.ap=null;back();toast(m.active?"Usuario suspendido":"Usuario reactivado")}break}
  case"proj-edit":{const p=v?S.projects[v]:null;const base=newProject();S.editProject=p?JSON.parse(JSON.stringify({...base,...p,_new:0,thr:{...base.thr,...(p.thr||{})},modules:{...base.modules,...(p.modules||{})},notify:{...base.notify,...(p.notify||{})}})):base;if(p)delete S.editProject._new;push("proyecto");break}
  case"proj-del":{const p=S.editProject;if(!p||!S.projects[p.id])return;const recs=S.records.filter(r=>r.projectId===p.id);if(!confirm(`¿Eliminar el proyecto "${p.nombre}"${recs.length?` y sus ${recs.length} registros`:""}? Esta acción no se puede deshacer.`))return;b.disabled=true;try{for(const r of recs){await S.db.doc("records/"+r.id).delete()}for(const m of Object.values(S.members).filter(m=>(m.projects||[]).includes(p.id))){await S.db.doc("members/"+m.id).update({projects:m.projects.filter(x=>x!==p.id)})}await S.db.doc("projects/"+p.id).delete();S.editProject=null;back();toast("Proyecto eliminado")}catch(err){b.disabled=false;toast("No se pudo eliminar el proyecto.")}break}
  case"user-del":{const id=S.reqId,u=S.members[id]||S.requests[id]||{};if(!confirm(`¿Eliminar a ${u.nombre||"este usuario"}? Perderá el acceso a la app. Sus registros se conservan.`))return;b.disabled=true;try{if(S.members[id])await S.db.doc("members/"+id).delete();if(S.requests[id])await S.db.doc("requests/"+id).delete();S.ap=null;back();toast("Usuario eliminado")}catch(err){b.disabled=false;toast("No se pudo eliminar el usuario.")}break}
  case"logo-del":syncProject();S.editProject.logo="";render();break;
  case"cf-add":{syncProject();const label=$("#cf-label").value.trim();if(!label){toast("Escribe el nombre del campo.");return}const t=$("#cf-t").value;const c={id:rid(5),mod:$("#cf-mod").value,label,t};if(t==="select"){c.opts=$("#cf-opts").value.split(",").map(s=>s.trim()).filter(Boolean);if(!c.opts.length){toast("Escribe las opciones.");return}}(S.editProject.customFields=S.editProject.customFields||[]).push(c);render();toast("Campo agregado. Guarda el proyecto para aplicarlo.");break}
  case"cf-del":syncProject();S.editProject.customFields.splice(+b.dataset.i,1);render();break;
  case"del-ex":{b.disabled=true;for(const r of S.records.filter(r=>r.ejemplo)){try{await S.db.doc("records/"+r.id).delete()}catch(err){}}for(const p of Object.values(S.projects).filter(p=>p.ejemplo)){try{await S.db.doc("projects/"+p.id).delete()}catch(err){}}toast("Ejemplos eliminados");break}
  case"adm-name":{const n=$("#adm-name").value.trim();if(!n)return;try{await S.db.doc("members/"+S.uid).set({nombre:n,role:"admin",active:true,projects:[],updatedAt:new Date().toISOString()});toast("Nombre guardado")}catch(err){toast("No se pudo guardar.")}break}
  case"discard":S.outbox=S.outbox.filter(o=>o.id!==v);saveOutbox();render();toast("Registro descartado");break;
  case"port":push("portafolio");break;
  case"port-dl":dlPortfolio();break;
 }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)closeModal();if((e.key==="Enter"||e.key===" ")&&e.target.matches(".sigbox[data-act]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset.f&&S.form){S.form.values[t.dataset.f]=t.dataset.split?t.value.split("\n").map(s=>s.trim()).filter(Boolean):t.value;const fe=t.closest(".field.err");if(fe){fe.classList.remove("err");fe.querySelector(".err-msg")?.remove();delete S.form.errors[t.dataset.f]}}
 else if(t.dataset.row&&S.form){const[k,i,c]=t.dataset.row.split("|");S.form.values[k][+i][c]=t.value}
 else if(t.dataset.inp==="q"){S.f.q=t.value;const l=$("#recList");if(l){const rs=filtered();l.innerHTML=rs.length?rs.slice(0,250).map(itemHTML).join(""):`<div class="empty">No hay registros con estos filtros.</div>`}}
});
document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.dataset.photo&&S.form){const f=t.files&&t.files[0];if(!f)return;try{(S.form.values[t.dataset.photo]=S.form.values[t.dataset.photo]||[]).push(await compress(f));render()}catch(err){toast("No se pudo leer la imagen.")}return}
 if(t.dataset.logo){const f=t.files&&t.files[0];if(!f)return;syncProject();try{S.editProject.logo=await compress(f,240,1,"image/png");render()}catch(err){toast("No se pudo leer el logo.")}return}
 const c=t.dataset.chg;if(!c)return;
 if(c==="proj"){S.projectId=t.value;lsSet("ehs.project",t.value)}else if(c==="period")S.f.period=t.value;else if(c==="fproj")S.f.proj=t.value;else if(c==="ftype")S.f.type=t.value;
 else if(c==="pwho")S.port.who=t.value;else if(c==="pfrom")S.port.from=t.value||S.port.from;else if(c==="pto")S.port.to=t.value||S.port.to;
 render();
});
document.addEventListener("submit",e=>{if(e.target.id==="userForm"){e.preventDefault();submitNewUser();return}if(e.target.id==="recForm")saveForm(e);else if(e.target.id==="regForm")submitRegister(e);else if(e.target.id==="projForm")saveProject(e);else e.preventDefault()});
window.startApp=boot;
</script>

</body></html>
